name: sonaive

networks:
  brd-sonaive:
    external: false

services:
  sonaive:
    image: quackerd/sonaive:latest
    ports:
      - 80:80/tcp # port 80 must be identity mapped for ACME challenges
      - 443:443/tcp # naiveproxy port
      - 443:443/udp # to also enable QUIC/H3
    environment:
      HOST: "example.com" # Your domain name
      PORT: "443" # which external port you use to access naiveproxy? for QR code and shared link generation.
      USER0: "alice" # An arbitrary number of users.
                    # Each USERX must have a corresponding PASSX and X must be strictly incrementing by 1.
      PASS0: "pass0"
      USER1: "bob"
      PASS1: "pass1"
      # ...
      SITE_URL: "decoy:3000" # address of the decoy site backend; comment out to return 403 for all non-proxied requests
      UPSTREAM_URL: "filter:1080" # upstream http proxy address, set empty to dial directly
      LOG_LEVEL: "info"
      SELF_SIGN: "false"
    restart: unless-stopped
    networks:
      - brd-sonaive
    volumes:
      - ./data:/opt/sonaive/data:Z # contains logs, certs, etc.

  decoy:
    image: quackerd/linux-docs:latest # full linux docs build with tarballs @ port 3000
                                      # see https://git.quacker.org/d/linux-docs
    restart: unless-stopped
    networks:
      - brd-sonaive

  filter:
    image: quackerd/singbox-filter:latest # singbox filter backend, mixed ingress @ port 1080
                                          # see https://git.quacker.org/d/singbox-filter
    environment:
      BLOCK_CN: "true"
      BLOCK_LOCAL: "true"
      BLOCK_ADS: "standard"
      LOG_LEVEL: "warn"
    restart: unless-stopped
    networks:
      - brd-sonaive
    volumes:
      - ./filter:/opt/singbox-filter/data:Z # contains cache.db