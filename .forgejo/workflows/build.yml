name: Build and Publish

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - "README.md"
      - "docker-compose.yml"
      - "LICENSE"

  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"

  workflow_dispatch:

env:
  REGISTRY: docker.io/quackerd

jobs:
  docker:
    runs-on: linux-amd64
    container:
      image: docker:27-cli

    steps:
      - name: Install Node and Docker CLI
        run: |
          apk add --no-cache \
                      nodejs \
                      npm \
                      git \
                      bash \
                      ca-certificates \
                      docker-cli \
                      docker-cli-buildx

      - uses: actions/checkout@v4

      - name: Set image name and date tag
        id: vars
        run: |
          set -euo pipefail
          name=sonaive
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            name=sonaive-dev
          fi
          echo "image=${REGISTRY}/${name}" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}


      - name: Build and Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:weekly-${{ steps.vars.outputs.date_tag }}

      - name: Obliteration
        if: always()
        uses: https://git.quacker.org/d/docker-obliterate-action@v1 